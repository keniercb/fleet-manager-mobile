name: registro_recorridos
description: >-
  APK Registro de Recorridos de Vehículos.
  Fase 1 — RF-01 Autenticación y sesión (login JWT, bootstrap /auth/me,
  logout, cambio de contraseña, manejo de sesión expirada).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado + DI (ADR-01)
  flutter_riverpod: ^2.5.1

  # Navegación con guards de sesión
  go_router: ^14.2.7

  # HTTP con interceptores (Bearer, 401 -> sesión expirada, mapeo de errores)
  dio: ^5.5.0

  # Almacenamiento seguro del token JWT (Keystore / Keychain) — RF-01.2
  flutter_secure_storage: ^9.2.2

  # Formato de fechas/números (es)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
